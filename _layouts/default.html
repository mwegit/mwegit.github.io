<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — Cloud &amp; Platform Engineer{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>

<div class="sitenav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} class="on"{% endif %}>Home</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.nav == 'projects' %} class="on"{% endif %}>Projects</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.nav == 'blog' %} class="on"{% endif %}>Blog</a>
    </nav>
  </div>
</div>

{{ content }}

<footer>
  <div class="wrap">
    <h2>Get in touch</h2>
    <p>Open to remote and contract work.</p>
    <div class="links">
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <a href="https://github.com/{{ site.github_user }}">GitHub</a>
    </div>
  </div>
</footer>

</body>
</html>
